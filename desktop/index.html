<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; media-src file:; style-src 'self' 'unsafe-inline'">
<title>Musical Chairs</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #37474F;
    color: #fff;
    font-family: "Segoe UI", system-ui, sans-serif;
    transition: background-color 0.2s;
  }
  #root {
    display: flex;
    flex-direction: column;
    min-height: 100%;
    padding: 28px 20px 20px;
    max-width: 560px;
    margin: 0 auto;
  }
  .center { text-align: center; }
  #big {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    font-size: 64px;
    font-weight: bold;
    white-space: pre-line;
    line-height: 1.15;
  }
  #sub { font-size: 28px; font-weight: bold; min-height: 1.3em; }
  #song { font-size: 15px; padding: 8px 0 4px; overflow-wrap: anywhere; }
  #seek { width: 100%; accent-color: #fff; }
  #time { font-size: 14px; padding-bottom: 16px; }
  button {
    font: inherit;
    border: none;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.92);
    color: #222;
    cursor: pointer;
  }
  button:hover { background: #fff; }
  #main { width: 100%; height: 96px; font-size: 30px; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row button { flex: 1; height: 64px; font-size: 18px; }
  h2 { font-size: 16px; text-align: center; margin: 20px 0 4px; }
  .stepper { display: flex; align-items: center; padding: 4px 0; font-size: 18px; }
  .stepper .name { flex: 1; }
  .stepper button { width: 56px; height: 56px; font-size: 22px; }
  .stepper .value { width: 72px; text-align: center; font-size: 20px; font-weight: bold; }
  #big.title { font-size: 48px; overflow-wrap: anywhere; }
  .modes { display: flex; gap: 8px; margin-bottom: 8px; }
  .modes button { flex: 1; height: 48px; font-size: 17px; background: rgba(255, 255, 255, 0.3); color: #fff; }
  .modes button.on { background: #fff; color: #222; font-weight: bold; }
  #startRow { padding: 8px 0; font-size: 18px; }
  #startRow .label { margin-bottom: 6px; }
  #startRow .modes button { font-size: 15px; height: 44px; }
  #markRow { margin: 0 0 12px; }
  #markRow button { height: 40px; font-size: 15px; background: rgba(255, 255, 255, 0.3); color: #fff; }
  #markRow button:hover { background: rgba(255, 255, 255, 0.45); }
  #markRow #mark { flex: 3; }
  label.switch { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; font-size: 18px; cursor: pointer; }
  label.switch input { width: 22px; height: 22px; accent-color: #fff; }
  #pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .pad { height: 64px; font-size: 24px; font-weight: bold; color: #fff; touch-action: none; user-select: none; transition: filter 0.1s, transform 0.1s; }
  .pad.empty { background: rgba(255, 255, 255, 0.18); }
  .pad.empty:hover { background: rgba(255, 255, 255, 0.3); }
  .pad.rec { background: #D50000; font-size: 18px; animation: pulse 1s infinite; }
  .pad.hit { filter: brightness(1.5); transform: scale(0.95); }
  @keyframes pulse { 50% { opacity: 0.7; } }
  #padsHint { font-size: 13px; opacity: 0.8; padding-top: 6px; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.8); padding: 10px 18px; border-radius: 20px;
    font-size: 15px; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="root">
  <div id="big" class="center"></div>
  <div id="sub" class="center"></div>
  <div id="song" class="center"></div>
  <input id="seek" type="range" min="0" max="1" step="0.1" value="0">
  <div id="time" class="center"></div>
  <div class="row" id="markRow">
    <button id="mark">📍 Start this song here</button>
    <button id="unmark">Undo</button>
  </div>
  <button id="main">Start</button>
  <div class="row">
    <button id="reset">Reset</button>
    <button id="pick">Choose music</button>
  </div>
  <h2>Sound pads</h2>
  <div id="pads"></div>
  <div id="padsHint" class="center">Tap 🎙 to record, tap again to stop. Hold or right-click a pad to record it again or delete it. Keys 1–8 play the pads.</div>
  <h2>Settings</h2>
  <div class="modes">
    <button id="modeChairs">Musical chairs</button>
    <button id="modeSwitch">Switch songs</button>
  </div>
  <div id="steppers"></div>
  <label class="switch" id="autoRow">Restart music automatically <input id="auto" type="checkbox"></label>
  <div id="startRow">
    <div class="label">Songs start at</div>
    <div class="modes">
      <button id="startCatchy">Catchy part</button>
      <button id="startRandom">Random spot</button>
      <button id="startResume">Where it left off</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="highlights.js"></script>
<script src="pads.js"></script>
<script src="renderer.js"></script>
</body>
</html>
